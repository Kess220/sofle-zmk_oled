# Uncomment the following line to enable the Sofle OLED Display
CONFIG_ZMK_DISPLAY=y

# Uncomment these two lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB DESABILITADO - Não temos hardware RGB e causa interferência
CONFIG_ZMK_RGB_UNDERGLOW=n

# BLUETOOTH OTIMIZADO PARA ESTABILIDADE
CONFIG_BT_CTLR_TX_PWR_PLUS_8=n       # Potência normal (menos interferência)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=n   # Desabilitar experimental (mais estável)

# OTIMIZAÇÕES DE DISPLAY E POWER
CONFIG_ZMK_DISPLAY_WORK_QUEUE_SYSTEM=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_STUDIO_LOCKING=n
