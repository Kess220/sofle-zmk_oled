# Uncomment the following line to enable the Sofle OLED Display
CONFIG_ZMK_DISPLAY=y

# Uncomment these two lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Sem RGB no hardware (só OLED)
CONFIG_ZMK_RGB_UNDERGLOW=n

# Mouse emulation (movimento/clique/scroll) na camada ADJUST (LOWER+RAISE)
# Só precisa no central (esquerdo) — é quem processa o keymap e gera os HID reports de mouse
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Desligado temporariamente como teste: suspeita de estar causando a reconexão
# lenta/desconexão aleatória no Windows via adaptador USB (renegociação de
# parâmetros de conexão que alguns stacks BT do Windows lidam mal). Se o
# problema sumir só com o ajuste de energia do USB no Windows, pode reativar.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=n
CONFIG_ZMK_STUDIO_LOCKING=n

# ===== OLED OTIMIZAÇÕES =====
# Thread dedicada para OLED (melhor performance)
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Mostrar % da bateria em vez de ícones
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Auto blank no idle (economia de energia)
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# Deep sleep após inatividade prolongada — corta o consumo de verdade (CPU/radio),
# diferente do BLANK_ON_IDLE que só apaga o render do OLED. Acorda no primeiro key press.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# Widget de palavras por minuto (aparece só do lado esquerdo)
CONFIG_ZMK_WIDGET_WPM_STATUS=y
