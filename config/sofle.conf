# Uncomment these two lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB DESABILITADO - Não temos hardware RGB e causa interferência
CONFIG_ZMK_RGB_UNDERGLOW=n

# ========== BLUETOOTH PADRÃO ZMK ==========
# (Usar configurações padrão para máxima compatibilidade)

# ========== DISPLAY CONFIGURAÇÃO PADRÃO ZMK ==========

# Habilita display (obrigatório)
CONFIG_ZMK_DISPLAY=y

# Thread dedicada para performance (recomendado para OLED)
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Personalização: Bateria em % (melhor que ícones)
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# ========== POWER E SISTEMA ==========
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_STUDIO_LOCKING=n
