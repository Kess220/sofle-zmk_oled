# Configurações específicas para o lado DIREITO (peripheral)
# Este arquivo sobrescreve o sofle.conf para o lado direito

# CORREÇÃO BLE: Desabilitar experimental conn no peripheral
# CONFIG_ZMK_BLE_EXPERIMENTAL_CONN é para o central (esquerdo) — no peripheral quebra o advertising BLE
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=n

# WPM só faz sentido no lado esquerdo (central)
CONFIG_ZMK_WIDGET_WPM_STATUS=n

# Thread dedicada para display — reduz pressão de memória no peripheral
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=n

# Sem RGB no hardware
CONFIG_ZMK_RGB_UNDERGLOW=n
